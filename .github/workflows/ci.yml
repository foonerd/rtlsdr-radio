name: ci

# Every change: the plugin's JavaScript checked and its tests run, in the Node version
# Volumio ships. The image they run in comes from the registry with the plugin's node
# modules in it; the run fetches nothing else.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  BUILDER_REGISTRY: ghcr.io/${{ github.repository }}-builder
  BUILDER_PUSH: 1

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: scripts/test-plugin.sh
