name: components

# The compiled parts of the plugin (the RTL-SDR tools, the DAB and RDS decoders), for
# each target, kept in the registry under a key made of everything they are built from
# (scripts/components-key.sh). A target whose key is already there is not built again:
# the builds run once per change of a source, and every build of the plugin after that
# only fetches what they made.
#
# Nothing is emulated: the three ARM targets are built on an ARM runner, whose processor
# runs 32-bit ARM programs as well. The images the builds run in (docker/) are kept in
# the registry too and are built only when docker/ changes.
on:
  workflow_call:
    outputs:
      key:
        description: The key the components are kept under
        value: ${{ jobs.key.outputs.key }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - components/**
      - docker/**
      - scripts/build-target.sh
      - scripts/builder-key.sh
      - scripts/node-image.sh
      - scripts/check-elf.sh
      - scripts/check-warnings.py
      - scripts/fetch-sources.sh
      - scripts/targets.sh
      - scripts/write-manifest.py
      - scripts/components-key.sh
      - .github/workflows/components.yml

permissions:
  contents: read
  packages: write

# One run at a time: a second one waits, and then finds the first one's work done
concurrency:
  group: components
  cancel-in-progress: false

jobs:
  key:
    name: key
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: |
          key="$(scripts/components-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "The components' key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: key
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arm, runner: ubuntu-24.04-arm }
          - { target: armv7, runner: ubuntu-24.04-arm }
          - { target: armv8, runner: ubuntu-24.04-arm }
          - { target: x64, runner: ubuntu-24.04 }
    env:
      IMAGE: ghcr.io/${{ github.repository }}-components:${{ matrix.target }}-${{ needs.key.outputs.key }}
      BUILDER_REGISTRY: ghcr.io/${{ github.repository }}-builder
      BUILDER_PUSH: 1
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Is it built already?
        id: have
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }}: in the registry, not built again" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }}: built in this run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        if: steps.have.outputs.found == 'false'
        run: ./build.sh ${{ matrix.target }}
      # Files only, so the image is the same whatever machine made it
      - name: Keep in the registry
        if: steps.have.outputs.found == 'false'
        run: |
          printf 'FROM scratch\nCOPY . /out/\n' | docker build -q --platform linux/amd64 -t "$IMAGE" -f - "out/${{ matrix.target }}"
          docker push -q "$IMAGE"
