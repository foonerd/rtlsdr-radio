name: release

# A tag builds the release: the tests, the built components fetched from the registry
# (built first if a source of theirs has changed), the plugin packed as the zip a player
# installs, and the zip published as a pre-release. Run by hand it does all of that and
# publishes nothing; the zip is kept with the run.
#
# Everything it needs comes from the project's own registry: the built components, and
# the Node image with the plugin's modules. Nothing is fetched from anywhere else.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDER_REGISTRY: ghcr.io/${{ github.repository }}-builder
  BUILDER_PUSH: 1

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: The tag names the version the plugin carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^ *"version": *"\(.*\)",*/\1/p' plugin/package.json | head -1)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the plugin is $version" >&2; exit 1; }
          scripts/release-notes.sh "$version" > /dev/null
      - run: scripts/test-plugin.sh

  components:
    uses: ./.github/workflows/components.yml
    permissions:
      contents: read
      packages: write

  package:
    name: pack, publish
    needs: [test, components]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: The built components
        run: REPOSITORY="${{ github.repository }}" scripts/fetch-components.sh "${{ needs.components.outputs.key }}"
      - name: The plugin's zip
        run: scripts/package-plugin.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/rtlsdr_radio-*.zip build.json | grep -F "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: rtlsdr_radio
          path: dist/rtlsdr_radio-*.zip
          if-no-files-found: error
      # Published as a pre-release: GitHub is where a version is tried before it goes
      # to the plugin store.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/rtlsdr_radio-*.zip \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --prerelease
